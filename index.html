<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="A calm study planner for your courses, classes, and reading habit." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=compact-forms-1" />
  <title>Eduvia — Your study planner</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="Eduvia home"><span class="brand-mark"><img class="brand-symbol" src="icon.svg" alt=""></span><span>Eduvia</span></a>
      <div class="side-caption">YOUR SPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="today"><span class="nav-icon">◷</span>Today</button>
        <button class="nav-item" data-page="courses"><span class="nav-icon">▦</span>My courses</button>
        <button class="nav-item" data-page="timetable"><span class="nav-icon">▤</span>Timetable</button>
        <button class="nav-item" data-page="habit"><span class="nav-icon">✳</span>Study habit</button>
        <button class="nav-item" data-page="tutorials"><span class="nav-icon">▷</span>Tutorials & notes</button>
        <button class="nav-item" data-page="study"><span class="nav-icon">✧</span>Study studio</button>
        <button class="nav-item" data-page="progress"><span class="nav-icon">↗</span>My progress</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="week-goal-mini"><div class="mini-label">THIS WEEK'S GOAL</div><div><strong id="sideGoal">0 / 5</strong><span> study sessions</span></div><div class="mini-track"><i id="sideGoalFill"></i></div></div>
        <button class="nav-item" data-page="more"><span class="nav-icon">•••</span>More</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="privacy-note"><span class="privacy-dot"></span>Private on this device</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>MY SPACE</span><b>›</b><strong id="crumbCurrent">Today</strong></div><div class="top-actions"><button id="installBtn" class="install-btn hidden">＋ Install app</button><button class="avatar" id="profileButton" title="Your profile">S</button></div></header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-page="today"><span class="mobile-nav-icon icon-today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.35 5.65"/><path d="M4 5v5h5"/><path d="M12 7v5l3 2"/></svg></span><span class="mobile-nav-label">Today</span></button>
    <button class="mobile-nav-item" data-page="courses"><span class="mobile-nav-icon icon-courses"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 13v7M13 16.5h7"/></svg></span><span class="mobile-nav-label">Courses</span></button>
    <button class="mobile-nav-item" data-page="timetable"><span class="mobile-nav-icon icon-timetable"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M7.5 3v4M16.5 3v4M4 10h16M8 14h3M8 17h6"/></svg></span><span class="mobile-nav-label">Schedule</span></button>
    <button class="mobile-nav-item" data-page="habit"><span class="mobile-nav-icon icon-habit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14 9l5.5-2-2 5.5 4 3.5-6 .5L12 21l-3.5-4.5-6-.5 4-3.5-2-5.5L10 9z"/><path d="m9.5 12.5 1.7 1.7 3.5-3.8"/></svg></span><span class="mobile-nav-label">Habit</span></button>
    <button class="mobile-nav-item" data-page="more"><span class="mobile-nav-icon icon-more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span><span class="mobile-nav-label">More</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="native-bridge.js?v=native-android-2" defer></script>
  <script src="push-config.js?v=phone-push-1" defer></script>
  <script src="app.js?v=renderer-audit-1" defer></script>
  <script src="study-studio.js?v=compact-forms-1" defer></script>
  <script src="feature-hub.js?v=compact-forms-1" defer></script>
</body>
</html>
