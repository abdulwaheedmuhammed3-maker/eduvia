name: Validate Eduvia scripts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check learner-profile.js
          node --check roadmap-core.js
          node --check roadmaps.js
          node --check app.js
          node --check entry-flow.js
          node --check study-quiz-core.js
          node --check study-studio.js
          node --check course-intelligence.js
          node --check lecture-intelligence.js
          npm test
          node --check feature-hub.js
          node --check experience.js
          node --check learning-expansions.js
          node --check recall-core.js
          node --check recall.js
          node --check voice-reflection.js
          node --check icon-system.js
          node --check native-bridge-src.js
          node --check scripts/build-web.mjs
          node --check scripts/prepare-android.mjs
          node --check scripts/configure-android-signing.mjs
          node --check service-worker.js
          node --check notifications-worker/src/index.js
      - name: Build the production web bundle
        run: npm run build:web
      - name: Verify feature bundle is loaded and cached
        run: |
          grep -q 'roadmap-core.js' index.html
          grep -q 'roadmap-core.js' service-worker.js
          grep -q 'roadmap-core.js' scripts/build-web.mjs
          grep -q 'roadmaps.js' index.html
          grep -q 'roadmaps.js' service-worker.js
          grep -q 'roadmaps.js' scripts/build-web.mjs
          grep -q 'roadmaps.css' index.html
          grep -q 'roadmaps.css' service-worker.js
          grep -q 'roadmaps.css' scripts/build-web.mjs
          grep -q 'study-quiz-core.js' index.html
          grep -q 'study-quiz-core.js' service-worker.js
          grep -q 'study-quiz-core.js' scripts/build-web.mjs
          grep -q 'course-intelligence.js' index.html
          grep -q 'lecture-intelligence.js' index.html
          grep -q 'lecture-intelligence.js' service-worker.js
          grep -q 'lecture-intelligence.js' scripts/build-web.mjs
          grep -q 'lecture-intelligence.css' index.html
          grep -q 'lecture-intelligence.css' service-worker.js
          grep -q 'lecture-intelligence.css' scripts/build-web.mjs
          grep -q 'course-intelligence.js' service-worker.js
          grep -q 'course-intelligence.js' scripts/build-web.mjs
          grep -q 'feature-hub.js' index.html
          grep -q 'feature-hub.js' service-worker.js
          grep -q 'learner-profile.js' index.html
          grep -q 'learner-profile.js' service-worker.js
          grep -q 'learner-profile.js' scripts/build-web.mjs
          grep -q 'app.js?v=' index.html
          grep -q 'entry-flow.js' index.html
          grep -q 'entry-flow.css' index.html
          grep -q 'visual-refresh.css' index.html
          grep -q 'discover-touch-fix-4' index.html
          grep -q 'discover-touch-fix-4' service-worker.js
          grep -q 'exp-discover-grid' experience.css
          grep -q 'touch-action:manipulation' experience.css
          grep -q 'exp-ask-prompt-grid' experience.css
          grep -q 'experience.js' index.html
          grep -q 'experience.css' index.html
          grep -q 'icon-system.css' index.html
          grep -q 'ui-polish.css' index.html
          grep -q 'icon-system.js' index.html
          grep -q 'icon-system.css' service-worker.js
          grep -q 'ui-polish.css' service-worker.js
          grep -q 'icon-system.js' service-worker.js
          grep -q 'icon-system.css' scripts/build-web.mjs
          grep -q 'ui-polish.css' scripts/build-web.mjs
          grep -q 'icon-system.js' scripts/build-web.mjs
          grep -q 'material-outline-2' index.html
          grep -q 'material-outline-2' service-worker.js
          grep -q 'Footer navigation keeps its original' icon-system.js
          ! grep -q "querySelectorAll('.mobile-nav-icon" icon-system.js
          ! grep -q '\.mobile-nav-item' icon-system.css
          grep -q 'dashboard:' icon-system.js
          grep -q 'forum:' icon-system.js
          grep -q 'explore:' icon-system.js
          grep -q '<svg viewBox="0 0 24 24"' index.html
          grep -q 'entry-flow.js' service-worker.js
          grep -q 'entry-flow.css' service-worker.js
          grep -q 'visual-refresh.css' service-worker.js
          grep -q 'experience.js' service-worker.js
          grep -q 'learning-expansions.js' index.html
          grep -q 'learning-expansions.js' service-worker.js
          grep -q 'learning-expansions.js' scripts/build-web.mjs
          grep -q 'recall-core.js' index.html
          grep -q 'recall-core.js' service-worker.js
          grep -q 'recall-core.js' scripts/build-web.mjs
          grep -q 'recall.js' index.html
          grep -q 'recall.js' service-worker.js
          grep -q 'recall.js' scripts/build-web.mjs
          grep -q 'recall.css' index.html
          grep -q 'recall.css' service-worker.js
          grep -q 'recall.css' scripts/build-web.mjs
          grep -q 'voice-reflection.js' index.html
          grep -q 'voice-reflection.js' service-worker.js
          grep -q 'voice-reflection.js' scripts/build-web.mjs
          grep -q 'voice-reflection.css' index.html
          grep -q 'voice-reflection.css' service-worker.js
          grep -q 'voice-reflection.css' scripts/build-web.mjs
          grep -q 'scripts/configure-android-signing.mjs' .github/workflows/build-android.yml
          grep -q 'EDUVIA_ANDROID_KEYSTORE_BASE64' .github/workflows/build-android.yml
          grep -q 'EDUVIA_ANDROID_KEYSTORE_PASSWORD' .github/workflows/build-android.yml
          grep -q 'EDUVIA_ANDROID_KEY_ALIAS' .github/workflows/build-android.yml
          grep -q 'EDUVIA_ANDROID_KEY_PASSWORD' .github/workflows/build-android.yml
          grep -q "if: github.event_name != 'pull_request'" .github/workflows/build-android.yml
          grep -q 'experience.css' service-worker.js
          grep -q 'entry-flow.js' scripts/build-web.mjs
          grep -q 'feature-hub.js' scripts/build-web.mjs
          grep -q 'entry-flow.css' scripts/build-web.mjs
          grep -q 'visual-refresh.css' scripts/build-web.mjs
          grep -q 'experience.js' scripts/build-web.mjs
          grep -q 'experience.css' scripts/build-web.mjs
          grep -q 'app.js?v=' service-worker.js
          grep -q 'eduvia-study-alarms-v2' native-bridge-src.js
          grep -q 'eduvia-v106-native-speech-keywords' service-worker.js
          grep -q 'theme-audit-2' index.html
          grep -q 'profile-audit-3-knowledge-check' index.html
          grep -q 'profile-audit-3-knowledge-check' service-worker.js
          grep -q 'theme-audit-2' service-worker.js
          ! grep -q 'user-scalable=no' index.html
          ! grep -q 'touchstart.*preventDefault' index.html
          grep -q 'storage-accessibility-2' index.html
          grep -q 'storage-accessibility-2' service-worker.js
          grep -q 'function storageGet(key)' app.js
          grep -q 'function storageSet(key,value)' app.js
          grep -q 'const storageError=storageSet(STORE_KEY' app.js
          grep -q 'function resolveHashRoute(hash)' app.js
          grep -q 'SUPPORTED_PAGE_ROUTES.has(route)?route:' app.js
