name: Build Eduvia Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Android beta
    runs-on: ubuntu-latest
    steps:
      - name: Check out Eduvia
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare the app and native permissions
        run: npm run android:prepare

      - name: Configure the persistent Eduvia beta signing key
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EDUVIA_ANDROID_KEYSTORE_BASE64: ${{ secrets.EDUVIA_ANDROID_KEYSTORE_BASE64 }}
          EDUVIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EDUVIA_ANDROID_KEYSTORE_PASSWORD }}
          EDUVIA_ANDROID_KEY_ALIAS: ${{ secrets.EDUVIA_ANDROID_KEY_ALIAS }}
          EDUVIA_ANDROID_KEY_PASSWORD: ${{ secrets.EDUVIA_ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build installable APK
        env:
          EDUVIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EDUVIA_ANDROID_KEYSTORE_PASSWORD }}
          EDUVIA_ANDROID_KEY_ALIAS: ${{ secrets.EDUVIA_ANDROID_KEY_ALIAS }}
          EDUVIA_ANDROID_KEY_PASSWORD: ${{ secrets.EDUVIA_ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: eduvia-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the latest Android beta APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-beta
          target_commitish: main
          name: Eduvia Android beta
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: >-
            Direct-install Android beta build of Eduvia. First-time setup offers a
            one-time notification invitation; if dismissed, enable phone alarms
            and notifications later in Settings. Camera permission is requested only
            when you choose Take a photo. This debug-signed APK is for direct
            installation and is not a Google Play release.
          files: android/app/build/outputs/apk/debug/app-debug.apk
