  <div id="entryFlow" class="entry-flow" role="dialog" aria-modal="true" aria-label="Welcome to Eduvia">
    <div class="entry-splash">
      <img src="icon.svg" alt="" class="entry-splash-mark" />
      <div class="entry-splash-name">Eduvia</div>
      <p>Learn <span>·</span> Practice <span>·</span> Excel</p>
      <div class="entry-splash-loader" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="Eduvia home"><span class="brand-mark"><img class="brand-symbol" src="icon.svg" alt=""></span><span>Eduvia</span></a>
      <div class="side-caption">YOUR SPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="today" data-nav-key="home"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-item" data-page="my-study" data-nav-key="my-study"><span class="nav-icon">▣</span>My Learning</button>
        <button class="nav-item" data-page="play" data-nav-key="play"><span class="nav-icon">◇</span>Play &amp; learn</button>
        <button class="nav-item" data-page="ask" data-nav-key="ask"><span class="nav-icon">✧</span>Ask Eduvia</button>
        <button class="nav-item" data-page="discover" data-nav-key="discover"><span class="nav-icon">⌕</span>Discover</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="week-goal-mini"><div class="mini-label">THIS WEEK'S GOAL</div><div><strong id="sideGoal">0 / 5</strong><span> study sessions</span></div><div class="mini-track"><i id="sideGoalFill"></i></div></div>
        <button class="nav-item" data-page="more" data-utility-nav="more"><span class="nav-icon">•••</span>More tools</button>
        <button class="nav-item" data-page="settings" data-utility-nav="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="privacy-note"><span class="privacy-dot"></span>Private on this device</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>MY SPACE</span><b>›</b><strong id="crumbCurrent">Today</strong></div><div class="top-actions"><button id="installBtn" class="install-btn hidden">＋ Install app</button><button class="avatar" id="profileButton" title="Your profile">S</button></div></header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Main navigation">
    <button type="button" class="mobile-nav-item active" data-page="today" data-nav-key="home"><span class="mobile-nav-icon icon-today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="mobile-nav-label">Home</span></button>
    <button class="mobile-nav-item" data-page="my-study" data-nav-key="my-study"><span class="mobile-nav-icon icon-my-study"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c3-1.2 5.8-.6 8 1.1v13c-2.2-1.7-5-2.3-8-1.1zM20 5.5c-3-1.2-5.8-.6-8 1.1v13c2.2-1.7 5-2.3 8-1.1z"/></svg></span><span class="mobile-nav-label">Learn</span></button>
    <button class="mobile-nav-item" data-page="play" data-nav-key="play"><span class="mobile-nav-icon icon-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 19 12 8 18.5z"/><path d="M4 8v8M2 10v4"/></svg></span><span class="mobile-nav-label">Play</span></button>
    <button class="mobile-nav-item" data-page="ask" data-nav-key="ask"><span class="mobile-nav-icon icon-ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="mobile-nav-label">Ask</span></button>
    <button class="mobile-nav-item" data-page="discover" data-nav-key="discover"><span class="mobile-nav-icon icon-discover"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></span><span class="mobile-nav-label">Discover</span></button>
  </nav>
